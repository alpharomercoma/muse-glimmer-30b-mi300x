[Service]
EnvironmentFile=/etc/caddy/vllm.env
# The stock unit runs "caddy run --environ", which prints every environment
# variable, including VLLM_API_KEY, into the journal on every start. Drop it.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
